---
name: "release"

on:
  push:
    tags:
      - "*"

jobs:
  release:
    name: "release"
    runs-on: "ubuntu-latest"
    steps:

      # checkout repo
      - name: "checkout"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      # setup go
      - name: "set up go"
        uses: "actions/setup-go@v7"
        with:
          go-version: "stable"

      # run goreleaser
      - name: "run goreleaser"
        uses: "goreleaser/goreleaser-action@v7"
        with:
          version: "v2.18.3"
          args: "release --clean --config ./.github/.goreleaser.yaml"
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
